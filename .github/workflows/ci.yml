name: core-ci
on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src experiments figures tools
      - name: Frozen A0 self-test
        run: PYTHONPATH=src python experiments/a0/self_test_frozen.py
      - name: Paper-scale self-test
        run: cd experiments/paper_scale && python scripts/self_test.py
      - name: Verify committed frozen evidence
        run: python tools/verify_frozen_evidence.py
      - name: Public-release audit
        run: python tools/release_audit.py
